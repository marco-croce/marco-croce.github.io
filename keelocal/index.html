<!DOCTYPE html>

<body>

<header class="app-header">

  <div class="lang-switch">
    <a href="?lang=it">IT</a> | <a href="?lang=en">EN</a>
  </div>
</header>

<main class="content">

  <p class="subtitle" id="subtitle"></p>

  <section>
    <h3 id="dataCollectionTitle"></h3>
    <p id="dataCollectionText"></p>
  </section>

  <section>
    <h3 id="dataStorageTitle"></h3>
    <p id="dataStorageText"></p>
  </section>

  <section>
    <h3 id="userResponsibilityTitle"></h3>
    <p id="userResponsibilityText"></p>
  </section>

  <section>
    <h3 id="thirdPartyTitle"></h3>
    <p id="thirdPartyText"></p>
  </section>

  <section>
    <h3 id="dataSharingTitle"></h3>
    <p id="dataSharingText"></p>
  </section>

  <section>
    <h3 id="permissionsTitle"></h3>
    <p id="permissionsText"></p>
  </section>

  <section>
    <h3 id="ageRestrictionTitle"></h3>
    <p id="ageRestrictionText"></p>
  </section>

  <section>
    <h3 id="policyChangesTitle"></h3>
    <p id="policyChangesText"></p>
  </section>

  <section>
    <h3 id="contactTitle"></h3>
    <p id="contactText">
      <a href="mailto:marcocroce.dev@gmail.com?subject=KeeLocal%20-%20Support%20Request">
        marcocroce.dev@gmail.com
      </a>
    </p>
  </section>

</main>

<script>
  const translations = {
    it: {
      title: "Informativa sulla Privacy",
      subtitle: "<strong>KeeLocal</strong> rispetta la privacy degli utenti.",

      userResponsibilityTitle: "Responsabilità dell’utente",
      userResponsibilityText: "L’utente è responsabile della sicurezza del proprio dispositivo e della protezione dei dati memorizzati. In caso di perdita, furto o danneggiamento del dispositivo, lo sviluppatore non potrà essere ritenuto responsabile.",

      thirdPartyTitle: "Servizi di terze parti",
      thirdPartyText: "L’app non utilizza servizi di terze parti per analisi, pubblicità o monitoraggio.",

      dataSharingTitle: "Condivisione dei dati",

      permissionsTitle: "Autorizzazioni",
      permissionsText: "Le eventuali autorizzazioni richieste dall’app vengono utilizzate esclusivamente per consentire il corretto funzionamento delle funzionalità sul dispositivo dell’utente. Nessun dato personale viene raccolto, trasmesso o condiviso.",

      ageRestrictionTitle: "Limitazione di età",
      ageRestrictionText: "L’applicazione è destinata esclusivamente a utenti maggiorenni (18+). Non è progettata per l’utilizzo da parte di minori e non raccoglie consapevolmente dati personali di soggetti di età inferiore ai 18 anni.",

      policyChangesTitle: "Modifiche alla presente informativa",
      policyChangesText: "Eventuali modifiche all’informativa saranno comunicate attraverso gli aggiornamenti dell’applicazione.",

      contactTitle: "Contatti",
      contactText: "Per qualsiasi informazione relativa al trattamento dei dati personali o per esercitare i diritti previsti dalla normativa vigente in materia di protezione dei dati personali, gli interessati possono contattarci al seguente indirizzo email:"
    },

    en: {
      title: "Privacy Policy",
      subtitle: "<strong>KeeLocal</strong> respects users privacy.",

      dataCollectionTitle: "Data Collection",
      dataCollectionText: "The application does not collect or transmit personal data to developers, third parties, or external services.",

      dataStorageTitle: "Data Storage",
      dataStorageText: "All data entered by the user (e.g., passwords, notes, or other information) is saved exclusively on the user's device. No data is sent to remote servers or shared with others.",

      userResponsibilityText: "The user is responsible for the security of their device and the protection of stored data. In case of loss, theft, or damage of the device, the developer cannot be held liable.",

      dataSharingTitle: "Data Sharing",

      ageRestrictionTitle: "Age Restriction",
      ageRestrictionText: "This application is intended exclusively for adult users (18+). It is not designed for use by minors and does not knowingly collect personal data from individuals under the age of 18.",

      policyChangesTitle: "Changes to this Policy",
      policyChangesText: "Any changes to this policy will be communicated through app updates.",

      contactTitle: "Contact",
      contactText: "For any information regarding the processing of personal data or to exercise the rights provided under applicable data protection laws, data subjects may contact us at the following email address:"
    }
  };

  const params = new URLSearchParams(window.location.search);
  const lang = params.get("lang") || "it";
  const t = translations[lang] || translations.it;

  document.documentElement.lang = lang;

  Object.keys(t).forEach(key => {
    const el = document.getElementById(key);
    if (el) el.innerHTML = t[key];
  });
</script>

</body>
</html>
